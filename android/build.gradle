plugins {
    id 'com.android.application' version '9.2.1'
}

android {
    namespace 'com.devinslick.fmdring'
    compileSdk 34

    defaultConfig {
        applicationId "com.devinslick.fmdring"
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName "0.9.0"
    }

    // Legacy tree from the gradle-free era — kept stable so the git history
    // reads as moves, not rewrites.
    sourceSets {
        main {
            java.srcDirs = ['src']
            aidl.srcDirs = ['src/aidl']
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDirs = ['res']
        }
    }

    // Signing: the debug keystore is NOT committed (public repo). CI decodes
    // the ANDROID_KEYSTORE_BASE64 secret into android/debug.keystore; local
    // builds point FMD_KEYSTORE_FILE at a keystore of their own. When neither
    // is present, AGP's default debug keystore applies (different signature —
    // won't update installed builds in place).
    def keystoreFile = null
    if (file('debug.keystore').exists()) {
        keystoreFile = file('debug.keystore')
    } else {
        def env = System.getenv('FMD_KEYSTORE_FILE')
        if (env != null && file(env).exists()) {
            keystoreFile = file(env)
        }
    }

    signingConfigs {
        debug {
            if (keystoreFile != null) {
                storeFile keystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    // Wear OS listener (Data Layer). FMD upstream stays Google-free —
    // the bridge is ours and carries platform SDKs.
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    // Garmin Connect IQ Mobile SDK (local AAR — no public Maven coordinate)
    implementation files('libs/connectiq-mobile-sdk.aar')
}
