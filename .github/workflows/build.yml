name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Build APK
        run: ANDROID_SDK="$ANDROID_HOME" ./android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FMDRing-apk
          path: android/FMDRing.apk
          if-no-files-found: error

  watchapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install pebble-tool
        run: uv tool install pebble-tool --python 3.13

      - name: Cache Pebble SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pebble-sdk
          key: pebble-sdk-latest

      - name: Install Pebble SDK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yes | pebble sdk install latest || true

      - name: Build watchapp
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd fmd-ring-watch && pebble build

      - uses: actions/upload-artifact@v4
        with:
          name: fmd-ring-pbw
          path: fmd-ring-watch/build/*.pbw
          if-no-files-found: error
