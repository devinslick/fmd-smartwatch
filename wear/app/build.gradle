plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devinslick.fmdremote.watch'
    compileSdk 34

    defaultConfig {
        applicationId "com.devinslick.fmdremote.watch"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
