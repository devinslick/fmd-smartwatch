name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/debug.keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > wear/debug.keystore

      - name: Fetch Garmin AAR (build-time, not committed)
        run: android/fetch-garmin-aar.sh

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FMDRing-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  watchapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install pebble-tool
        run: uv tool install pebble-tool --python 3.13

      - name: Cache Pebble SDK
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pebble-sdk
          key: pebble-sdk-latest

      - name: Install Pebble SDK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yes | pebble sdk install latest || true

      - name: Build watchapp
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd pebble && pebble build

      - uses: actions/upload-artifact@v4
        with:
          name: fmd-remote-pbw
          path: pebble/build/*.pbw
          if-no-files-found: error

  wear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > wear/debug.keystore

      - name: Build wear modules
        run: cd wear && ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fmd-remote-wear
          path: wear/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  bangle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          node --check bangle/app.js
          python3 -m json.tool bangle/app.json > /dev/null

  zepp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: |
          python3 -m py_compile zepp/relay/relay.py
          cp zepp/app.js /tmp/a.mjs && node --check /tmp/a.mjs
          cp zepp/app-side/index.js /tmp/b.mjs && node --check /tmp/b.mjs
